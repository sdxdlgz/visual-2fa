services:
  visual-2fa:
    image: ghcr.io/sdxdlgz/visual-2fa:${VISUAL_2FA_TAG:-latest}
    container_name: visual-2fa
    restart: unless-stopped
    environment:
      DATABASE_URL: file:./data/visual-2fa.db
      SESSION_DAYS: ${SESSION_DAYS:-7}
      APP_ORIGIN: ${APP_ORIGIN:-}
    ports:
      - "${VISUAL_2FA_PORT:-28473}:3000"
    volumes:
      - visual-2fa-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  visual-2fa-data:
